name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-dotnet:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore -c Release

      - name: Run xUnit tests
        run: dotnet test tests/PowertrainCli.Tests/PowertrainCli.Tests.csproj --no-build -c Release --verbosity normal

  lint-python:
    name: Validate Python Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt
          pip install flake8

      - name: Lint syntax & imports
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 ingestion --count --select=E9,F63,F7,F82 --show-source --statistics

  build-docker:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: [test-dotnet, lint-python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: docker build -t f1-powertrain-cli:ci .